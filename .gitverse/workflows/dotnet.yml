name: .NET Core Desktop GitVerse

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    # Используем стандартный Windows-раннер GitVerse/RuStore
    runs-on: windows-latest

    env:
      Solution_Name: ELRSControl.slnx
      Test_Project_Path: ELRSControl\ELRSControl.csproj

    steps:
    # Заменяем GitHub-экшен на официальное зеркало в GitVerse
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Установка .NET Core (удален дублирующийся шаг из вашего шаблона)
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Добавление MSBuild в PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Запуск юнит-тестов
    - name: Execute unit tests
      run: dotnet test

    # Восстановление зависимостей (исправлен синтаксис переменных для PowerShell)
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Matrix_Configuration
      env:
        Matrix_Configuration: ${{ matrix.configuration }}

    # Сборка проекта
    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }}

    # Публикация артефактов
    - name: Publish
      run: dotnet publish --configuration ${{ matrix.configuration }} --output ./publish
