name: .NET 10 WPF Desktop CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    # Для WPF сборка возможна ТОЛЬКО на Windows-раннере
    runs-on: windows-latest

    env:
      Solution_Name: ELRSControl.slnx
      Test_Project_Path: ELRSControl\ELRSControl.csproj

    steps:
    # Получение исходного кода из репозитория GitVerse
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Установка .NET 10 SDK
    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Добавление MSBuild в PATH (необходимо для старых проектов или специфичных .slnx процессов)
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Восстановление зависимостей (NuGet пакетов) через CLI
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Запуск юнит-тестов (если они есть)
    - name: Execute unit tests
      run: dotnet test --no-restore

    # Сборка WPF приложения под конкретную конфигурацию (Debug/Release)
    - name: Build Application
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --no-restore

    # Публикация готового .exe и зависимостей в папку ./publish
    - name: Publish Application
      run: dotnet publish ${{ env.Solution_Name }} --configuration ${{ matrix.configuration }} --output ./publish/${{ matrix.configuration }}
